[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tfidfsum"
version = "0.1.1"
description = "Extractive TF-IDF text summarization for Ukrainian and English"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yurii Karpenko" }]
dependencies = ["scikit-learn", "numpy"]

keywords = ["nlp", "text-summarization", "tf-idf", "extractive-summarization", "ukrainian", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Ukrainian",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://github.com/ZavarOvek/tf-idf-summariser"
Repository = "https://github.com/ZavarOvek/tf-idf-summariser"
Issues = "https://github.com/ZavarOvek/tf-idf-summariser/issues"
Changelog = "https://github.com/ZavarOvek/tf-idf-summariser/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.2"]

[project.scripts]
tfidf-sum = "tfidfsum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "BLE", "SLF"]
ignore = [
    # RUF001-003 flag Cyrillic letters as "ambiguous" look-alikes of Latin ones.
    # This project is about Ukrainian text, so those are false positives by design.
    "RUF001",
    "RUF002",
    "RUF003",
    # E501 is left to `ruff format`; two tools arguing over line length is worse
    # than one, and the formatter cannot split string literals anyway.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]
