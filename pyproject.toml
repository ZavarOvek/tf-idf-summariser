[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfidfsum"
version = "0.1.0"
description = "Extractive TF-IDF text summarization for Ukrainian and English"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yurii Karpenko" }]
dependencies = ["scikit-learn", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tfidf-sum = "tfidfsum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
